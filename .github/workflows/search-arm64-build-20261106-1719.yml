name: Search ARM64 Build 20261106-1719

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'TMessagesProj/src/main/java/org/telegram/messenger/MessagesStorage.java'
      - 'TMessagesProj/src/main/java/org/telegram/ui/Adapters/DialogsSearchAdapter.java'
      - '.github/workflows/search-arm64-build-20261106-1719.yml'

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-search-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-search-

      - name: Build ARM64-v8a debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --no-parallel --max-workers=2 --stacktrace -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g"

      - name: Verify APK ABI
        run: |
          APK="TMessagesProj_App/build/outputs/apk/afat/debug/app.apk"
          test -f "$APK"
          unzip -l "$APK" | tee apk-contents.txt
          ABI_LIST="$(unzip -Z1 "$APK" | awk -F/ '$1=="lib" {print $2}' | sort -u)"
          test "$ABI_LIST" = "arm64-v8a"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-search-arm64v8a-20261106-1719
          path: TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
          if-no-files-found: error
          retention-days: 14
